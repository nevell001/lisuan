name: Build

# 构建门禁：测试 + SpotBugs(High) + JaCoCo(≥10%)，与本地 `mvn verify` 完全一致。
# 说明：本仓库作为 Gitee 的镜像，sync.yaml 同步时会备份并恢复 .github/workflows，本文件不会被覆盖。
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: mvn verify (Java 17)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # 默认构建已排除需要真实显示环境的 LoginControllerUITest；
      # 仍准备 Xvfb，避免任何 JavaFX 工具包初始化导致无头失败。
      - name: Ensure Xvfb
        run: |
          if ! command -v xvfb-run >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y xvfb
          fi

      - name: Maven verify (tests + SpotBugs + JaCoCo)
        run: xvfb-run -a mvn -B -ntp verify

      - name: Upload surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 7
