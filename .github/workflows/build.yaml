name: Build

# 构建门禁：测试 + SpotBugs(High) + JaCoCo(≥10%)，与本地 `mvn verify` 完全一致。
# 说明：本仓库作为 Gitee 的镜像，sync.yaml 同步时会备份并恢复 .github/workflows，本文件不会被覆盖。
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: mvn verify (Java 17)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # 全部 action 都选以 Node 24 为目标的大版本，避免 Node 20 弃用告警：
      # checkout >= v5、setup-java >= v5、upload-artifact >= v6（v5 仍是 node20）。
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # 默认构建已排除需要真实显示环境的 LoginControllerUITest；
      # 仍准备 Xvfb，避免任何 JavaFX 工具包初始化导致无头失败。
      - name: Ensure Xvfb
        run: |
          if ! command -v xvfb-run >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y xvfb
          fi

      # PDF 导出必须嵌入一个 PDFBox 能处理的 TrueType(glyf) 中文字体：Ubuntu 镜像默认不含
      # 中文字体，而项目内置的 NotoSansSC-Regular.ttc 是 OTF/CFF，PDFBox 无法嵌入。
      # 选 AR PL UMing：TrueType、且同时覆盖拉丁/数字与中文
      # （Droid Sans Fallback 只有 CJK 字形，渲染数字会抛 No glyph for U+0031）。
      - name: Install CJK TrueType font
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-arphic-uming
          test -f /usr/share/fonts/truetype/arphic/uming.ttc

      - name: Maven verify (tests + SpotBugs + JaCoCo)
        run: xvfb-run -a mvn -B -ntp verify

      - name: Upload surefire reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: surefire-reports
          path: target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 7
