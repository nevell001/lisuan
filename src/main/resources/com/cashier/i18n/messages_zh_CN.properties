wizard.instructions=打包说明：\n━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n1. 确保 Maven 和 JDK 已安装并配置环境变量\n2. 确保项目目录有写入权限\n3. 打包过程可能需要 5-10 分钟，请耐心等待\n4. 生成的 EXE 文件可直接分发安装\n\n打包完成后：\n- 安装包将保存到指定输出目录\n- 用户运行 EXE 即可安装，无需配置\n- 内嵌 JRE 版本无需用户安装 Java

